[package]
name = "cohors-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "time"] }
